# Standalone additive stack; shares only the existing application network.
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set pinned PROMETHEUS_IMAGE}
    restart: unless-stopped
    networks: [obs-backend, obs-access]
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --storage.tsdb.wal-compression
      - --query.max-concurrency=4
      - --query.max-samples=1000000
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - obs-prometheus:/prometheus
    logging:
      driver: local
      options: { max-size: "5m", max-file: "2" }

  grafana:
    image: ${GRAFANA_IMAGE:?Set pinned GRAFANA_IMAGE}
    restart: unless-stopped
    networks: [obs-access]
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3030}:3000"]
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - obs-grafana:/var/lib/grafana
    logging:
      driver: local
      options: { max-size: "5m", max-file: "2" }

  loki:
    image: ${LOKI_IMAGE:?Set pinned LOKI_IMAGE}
    restart: unless-stopped
    networks: [obs-access]
    mem_limit: 384m
    cpus: 0.4
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    command: ["-config.file=/etc/loki/config.yml", "-config.expand-env=false"]
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]
    volumes:
      - ../loki/config.yml:/etc/loki/config.yml:ro
      - obs-loki:/loki

  jaeger:
    image: ${JAEGER_IMAGE:?Set pinned JAEGER_IMAGE}
    restart: unless-stopped
    networks: [obs-access]
    mem_limit: 512m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:${JAEGER_PORT:-16686}:16686"]
    volumes: ["obs-jaeger:/badger"]

  alloy:
    image: ${ALLOY_IMAGE:?Set pinned ALLOY_IMAGE}
    restart: unless-stopped
    depends_on:
      alloy-init:
        condition: service_completed_successfully
    networks: [obs-access, obs-backend]
    mem_limit: 256m
    cpus: 0.3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "473:473"
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    ports: ["127.0.0.1:${ALLOY_OTLP_HTTP_PORT:-4318}:4318"]
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - obs-alloy:/var/lib/alloy
      # Runtime release mounts the app-owned log directory here read-only; never docker.sock.
      - ${APP_LOG_DIR:?Set APP_LOG_DIR}:/var/log/ticketing:ro

  # One-shot ownership setup for Alloy's own checkpoint volume; runtime remains uid 473.
  alloy-init:
    image: ${ALLOY_IMAGE:?Set pinned ALLOY_IMAGE}
    restart: "no"
    user: "0:0"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    entrypoint: ["/bin/sh", "-c", "mkdir -p /var/lib/alloy && chown -R 473:473 /var/lib/alloy"]
    volumes:
      - obs-alloy:/var/lib/alloy

networks:
  # An internal-only bridge cannot serve the host-published UI port on all engines.
  # This bridge belongs only to obs; no application/connector network is modified.
  obs-access:
    driver: bridge
  obs-backend:
    external: true
    name: ${OBS_NETWORK:?Set the existing application Docker network}

volumes:
  obs-prometheus:
  obs-grafana:
  obs-loki:
  obs-jaeger:
  obs-alloy:
