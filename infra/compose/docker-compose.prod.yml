# Chỉ hạ tầng T-207. Env bắt buộc: --env-file /etc/ticketing/.env.prod.
# Tunnel container dùng overlay docker-compose.tunnel.yml; base giữ Kong loopback.
name: ticketing-prod

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-postgres: &postgres
  image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a verified digest}
  restart: unless-stopped
  networks: [backend]
  logging: *logging
  command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB"]
  healthcheck:
    test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d postgres']
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Set POSTGRES_ADMIN_USER}
  POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
  POSTGRES_DB: postgres
  POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256

services:
  postgres:
    <<: *postgres
    environment:
      <<: *postgres-env
      SERVICE_DATABASES: identity event resale merch notification finance ai
      DB_PASSWORD_IDENTITY: ${DB_PASSWORD_IDENTITY:?Set DB_PASSWORD_IDENTITY}
      DB_PASSWORD_EVENT: ${DB_PASSWORD_EVENT:?Set DB_PASSWORD_EVENT}
      DB_PASSWORD_RESALE: ${DB_PASSWORD_RESALE:?Set DB_PASSWORD_RESALE}
      DB_PASSWORD_MERCH: ${DB_PASSWORD_MERCH:?Set DB_PASSWORD_MERCH}
      DB_PASSWORD_NOTIFICATION: ${DB_PASSWORD_NOTIFICATION:?Set DB_PASSWORD_NOTIFICATION}
      DB_PASSWORD_FINANCE: ${DB_PASSWORD_FINANCE:?Set DB_PASSWORD_FINANCE}
      DB_PASSWORD_AI: ${DB_PASSWORD_AI:?Set DB_PASSWORD_AI}
    volumes:
      - pg-shared:/var/lib/postgresql/data
      - ../postgres/prod-init:/docker-entrypoint-initdb.d:ro

  postgres-booking:
    <<: *postgres
    environment:
      <<: *postgres-env
      SERVICE_DATABASES: booking
      DB_PASSWORD_BOOKING: ${DB_PASSWORD_BOOKING:?Set DB_PASSWORD_BOOKING}
    volumes:
      - pg-booking:/var/lib/postgresql/data
      - ../postgres/prod-init:/docker-entrypoint-initdb.d:ro

  postgres-payment:
    <<: *postgres
    environment:
      <<: *postgres-env
      SERVICE_DATABASES: payment
      DB_PASSWORD_PAYMENT: ${DB_PASSWORD_PAYMENT:?Set DB_PASSWORD_PAYMENT}
    volumes:
      - pg-payment:/var/lib/postgresql/data
      - ../postgres/prod-init:/docker-entrypoint-initdb.d:ro

  postgres-ticket:
    <<: *postgres
    environment:
      <<: *postgres-env
      SERVICE_DATABASES: ticket
      DB_PASSWORD_TICKET: ${DB_PASSWORD_TICKET:?Set DB_PASSWORD_TICKET}
    volumes:
      - pg-ticket:/var/lib/postgresql/data
      - ../postgres/prod-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to a verified digest}
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: ${KAFKA_IMAGE:?Set KAFKA_IMAGE to a verified digest}
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Job một lần do deploy.sh chạy sau khi broker healthy, không phải daemon.
  kafka-init:
    image: ${KAFKA_IMAGE:?Set KAFKA_IMAGE to a verified digest}
    profiles: [bootstrap]
    restart: "no"
    networks: [backend]
    logging: *logging
    volumes:
      - ../kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE to a verified digest}
    restart: unless-stopped
    networks: [backend]
    logging: *logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    # Image distroless không có curl/shell. deploy.sh probe HTTP từ Redis Alpine.

  kong:
    image: ${KONG_IMAGE:?Set KONG_IMAGE to a verified digest}
    restart: unless-stopped
    networks: [backend, edge]
    logging: *logging
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.prod.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../kong/kong.prod.yml:/kong/kong.prod.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Chỉ bật khi image nghiệp vụ đã được build, scan và pull thành công.
  # Ví dụ booking; không publish port hoặc dùng credential infra_admin:
  # booking:
  #   image: ${BOOKING_IMAGE:?Set a verified booking image digest}
  #   restart: unless-stopped
  #   networks: [backend, edge] # edge cho egress API bên ngoài nếu cần
  #   env_file: /etc/ticketing/booking.env.prod
  #   environment:
  #     PORT: 3003
  #     NODE_ENV: production
  #   depends_on:
  #     postgres-booking: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #     kafka: { condition: service_healthy }
  #   healthcheck:
  #     test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 12
  # Các service khác dùng cùng mẫu, đúng user/database và hostname trong vps-setup.md.
  # Thêm route Kong tới hostname container khi kích hoạt; giữ chặn /internal.

networks:
  backend:
    internal: true
  edge:
    driver: bridge

volumes:
  pg-shared:
  pg-booking:
  pg-payment:
  pg-ticket:
  redis-data:
  kafka-data:
  minio-data:
