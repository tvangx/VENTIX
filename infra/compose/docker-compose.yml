# Hạ tầng dùng chung cho DEV. Các service nghiệp vụ chạy bằng `pnpm dev` trên máy host
# và được Kong trỏ tới qua host.docker.internal.
# Chạy:  make up        (xem Makefile)
name: ticketing

services:
  # ---------- PostgreSQL: 1 server dev, mỗi service 1 DATABASE + 1 USER riêng ----------
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_admin_dev}
      DB_PASSWORD_IDENTITY: ${DB_PASSWORD_IDENTITY:-identity_dev}
      DB_PASSWORD_EVENT: ${DB_PASSWORD_EVENT:-event_dev}
      DB_PASSWORD_BOOKING: ${DB_PASSWORD_BOOKING:-booking_dev}
      DB_PASSWORD_PAYMENT: ${DB_PASSWORD_PAYMENT:-payment_dev}
      DB_PASSWORD_TICKET: ${DB_PASSWORD_TICKET:-ticket_dev}
      DB_PASSWORD_RESALE: ${DB_PASSWORD_RESALE:-resale_dev}
      DB_PASSWORD_MERCH: ${DB_PASSWORD_MERCH:-merch_dev}
      DB_PASSWORD_NOTIFICATION: ${DB_PASSWORD_NOTIFICATION:-notification_dev}
      DB_PASSWORD_FINANCE: ${DB_PASSWORD_FINANCE:-finance_dev}
      DB_PASSWORD_AI: ${DB_PASSWORD_AI:-ai_dev}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Redis: seat hold, queue, cache. noeviction vì key giữ ghế là DỮ LIỆU ----------
  redis:
    image: redis:${REDIS_VERSION:-7.4}-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------- Kafka (KRaft, 1 broker) ----------
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-3.8.0}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Job chạy 1 lần: tạo topic theo Tài liệu KT mục 4
  kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-3.8.0}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ../kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]
    restart: "no"

  # ---------- MinIO (S3 tương thích) ----------
  minio:
    # MinIO không còn đăng image mới lên Docker Hub (minio/minio, minio/mc) nên dùng bản Chainguard.
    # Đổi image qua MINIO_IMAGE / MINIO_MC_IMAGE trong .env nếu cần.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-cgr.dev/chainguard/minio-client:latest-dev}
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /dev/null 2>&1; do sleep 2; done
        mc mb --ignore-existing local/event-banners local/organizer-docs local/merch-images
        echo "minio buckets ready"
    restart: "no"

  # ---------- Mailpit: nhận email dev (SMTP 1025, UI 8025) ----------
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # ---------- Kong DB-less ----------
  kong:
    image: kong:${KONG_VERSION:-3.8}
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    volumes:
      - ../kong/kong.yml:/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------- Công cụ xem dữ liệu (tuỳ chọn): make tools ----------
  kafka-ui:
    profiles: ["tools"]
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:8089:8080"

  adminer:
    profiles: ["tools"]
    image: adminer:latest
    ports:
      - "127.0.0.1:8088:8080"

volumes:
  pgdata:
  redisdata:
  kafkadata:
  miniodata:
