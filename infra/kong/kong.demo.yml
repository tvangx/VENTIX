# T-208 demo; container upstreams, same-origin SPA and SSE.
_format_version: "3.0"

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: cors
    config:
      origins: ["https://ventixxx.dpdns.org"]
      methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Authorization, Content-Type, Idempotency-Key, X-Request-Id, X-Admission-Token]
      exposed_headers: [X-Request-Id]
      credentials: true
      max_age: 3600

routes:
  # /metrics chỉ dành cho scrape nội bộ, kể cả khi service dùng route prefix rộng.
  - name: block-metrics
    paths: ["~/(?i:(?:.*/)?metrics)(?:/|$)"]
    regex_priority: 1000
    plugins:
      - name: request-termination
        config:
          status_code: 404
          content_type: application/json
          body: '{"message":"Not found"}'
      - name: cors
        config:
          preflight_continue: true

  - name: infra-health
    paths: ["~/health/infra$"]
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: application/json
          body: '{"status":"ok","scope":"infrastructure-only"}'
  # Không gắn service: không thể forward internal sang upstream.
  # Không giới hạn method/host để tránh route public thắng nhờ nhiều tiêu chí hơn.
  - name: block-internal
    paths: ["~/.*(?i:internal)"]
    regex_priority: 1000
    plugins:
      - name: request-termination
        config:
          status_code: 404
          content_type: application/json
          body: '{"message":"Not found"}'
      # CORS mặc định kết thúc OPTIONS trước request-termination; internal phải tới 404.
      - name: cors
        config:
          preflight_continue: true

services:
  - name: identity-service
    url: http://identity:3001
    routes:
      - { name: identity, paths: ["/api/identity"], strip_path: true }
    plugins:
      - &public-body-limit
        name: request-size-limiting
        config: { allowed_payload_size: 2 }
      - name: rate-limiting
        config: { minute: 120, policy: local, limit_by: ip }

  - name: event-service
    url: http://event:3002
    # Đặt guard trên service public để internal luôn kết thúc 404, kể cả khi
    # client đã hết quota hoặc gửi body quá lớn (plugin termination chạy sau).
    plugins: &public-plugins
      - *public-body-limit
      - name: rate-limiting
        config: { minute: 1200, policy: local, limit_by: ip }
    routes:
      - { name: event, paths: ["/api/event"], strip_path: true }

  - name: booking-service
    read_timeout: 3600000
    write_timeout: 3600000
    url: http://booking:3003
    plugins: *public-plugins
    routes:
      - name: booking
        paths: ["/api/booking"]
        strip_path: true
        response_buffering: false
        request_buffering: false
      # Lookahead chỉ match/strip /api/booking, giữ nguyên /v1/... cho upstream.
      # Có boundary để /holds-other không dùng nhầm quota holds.
      - name: booking-holds
        paths: ["~/api/booking(?=(?i:/v1/holds)(?:/|$))"]
        regex_priority: 100
        strip_path: true
        plugins:
          - name: rate-limiting
            config: { minute: 60, policy: local, limit_by: ip }
      - name: booking-checkout
        paths: ["~/api/booking(?=(?i:/v1/checkout)(?:/|$))"]
        regex_priority: 100
        strip_path: true
        plugins:
          - name: rate-limiting
            config: { minute: 20, policy: local, limit_by: ip }
      - name: booking-queue-join
        paths: ["~/api/booking(?=(?i:/v1/queue/join)(?:/|$))"]
        regex_priority: 100
        strip_path: true
        plugins:
          - name: rate-limiting
            config: { minute: 30, policy: local, limit_by: ip }

  - name: payment-service
    url: http://payment:3004
    plugins: *public-plugins
    routes:
      - { name: payment, paths: ["/api/payment"], strip_path: true }

  - name: ticket-service
    url: http://ticket:3005
    plugins: *public-plugins
    routes:
      - { name: ticket, paths: ["/api/ticket"], strip_path: true }

  - name: web-service
    url: http://web:8080
    routes:
      - { name: web, paths: ["/"], strip_path: false }
