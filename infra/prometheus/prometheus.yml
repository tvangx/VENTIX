global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: exporters
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels: { exporter: kafka }
      - targets: ["redis-exporter:9121"]
        labels: { exporter: redis }
  # One postgres_exporter per independent cluster; `cluster` is a fixed, bounded set.
  - job_name: postgres
    sample_limit: 5000
    label_limit: 20
    label_value_length_limit: 200
    static_configs:
      - targets: ["postgres-exporter-shared:9187"]
        labels: { exporter: postgres, cluster: shared }
      - targets: ["postgres-exporter-booking:9187"]
        labels: { exporter: postgres, cluster: booking }
      - targets: ["postgres-exporter-payment:9187"]
        labels: { exporter: postgres, cluster: payment }
      - targets: ["postgres-exporter-ticket:9187"]
        labels: { exporter: postgres, cluster: ticket }
  - job_name: application
    honor_labels: true
    metrics_path: /metrics
    sample_limit: 20000
    label_limit: 20
    label_value_length_limit: 200
    file_sd_configs:
      - files: [/etc/prometheus/targets/apps.json]
        refresh_interval: 30s
