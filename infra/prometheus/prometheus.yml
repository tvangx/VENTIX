global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: application
    honor_labels: true
    metrics_path: /metrics
    sample_limit: 20000
    label_limit: 20
    label_value_length_limit: 200
    file_sd_configs:
      - files: [/etc/prometheus/targets/apps.json]
        refresh_interval: 30s
